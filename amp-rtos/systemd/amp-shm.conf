# AMP 的"共享内存 + 门铃"模块，装好后由 systemd-modules-load 在开机时拉起，
# /dev/amp0 会自动出现。安装方式：make install
#
# 为什么不用自写的 .service 去 insmod：
# 模块文件放在 /root 下，SELinux 标签是 user_home_t，init_t 加载不了，
# 会报 "could not insert module ... Permission denied"。
# 装到 /lib/modules/$(uname -r)/extra/ 之后标签是 modules_object_t，
# 内核才允许加载。
amp_shm
